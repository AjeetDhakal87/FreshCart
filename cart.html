<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FreshCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            margin-top: 40px;
        }
        .cart-items {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }
        .cart-summary {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            height: fit-content;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 100px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
        }
        .cart-item-info {
            flex-grow: 1;
        }
        .cart-item-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .cart-item-price {
            color: var(--primary-color);
            font-weight: 700;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .qty-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dark);
        }
        .remove-btn {
            color: #e74c3c;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .summary-total {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        .empty-cart {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
        @media(max-width: 768px) {
            .cart-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar document-navbar"></nav>

    <main class="container">
        <h1>Your Shopping Cart</h1>
        <div class="cart-container">
            <div class="cart-items" id="cartItemsContainer">
                <!-- Injected via JS -->
            </div>
            
            <div class="cart-summary">
                <h2 style="margin-bottom: 20px;">Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotalAmount">Rs. 0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span id="deliveryAmount">Rs. 0.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="totalAmount">Rs. 0.00</span>
                </div>
                <a href="checkout.html" class="btn btn-primary" style="width: 100%; text-align: center; display: block; box-sizing: border-box; background-color: #60BB46;">Proceed to Checkout</a>
            </div>
        </div>
    </main>

    <footer class="document-footer"></footer>

    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
