<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - FreshCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .page-header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .filter-select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-dark);
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar document-navbar"></nav>

    <main class="container">
        <div class="page-header" style="flex-wrap: wrap; gap: 15px;">
            <h1 class="page-title">All Products</h1>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
                <div class="search-bar" style="display: flex; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 5px; flex: 1; min-width: 250px;">
                    <i class="fa-solid fa-magnifying-glass" style="padding: 10px; color: var(--text-light);"></i>
                    <input type="text" id="productSearchInput" placeholder="Search products..." style="flex: 1; border: none; background: transparent; padding: 5px 10px 5px 0; outline: none; color: var(--text-dark);">
                </div>
                <select class="filter-select" id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="vegetables">Vegetables</option>
                    <option value="fruits">Fruits</option>
                    <option value="grains">Grains & Staples</option>
                    <option value="pulses">Pulses & Legumes</option>
                    <option value="spices">Spices & Seasonings</option>
                    <option value="dairy">Dairy Products</option>
                    <option value="meat">Meat & Protein</option>
                    <option value="beverages">Beverages</option>
                    <option value="snacks">Snacks & Packaged Foods</option>
                    <option value="household">Household Items</option>
                </select>
            </div>
        </div>

        <!-- Rendered by JS -->
        <div class="product-grid" id="productGrid"></div>
    </main>

    <footer class="document-footer"></footer>

    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
